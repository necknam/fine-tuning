version: growpath-knowledge/v1
namespace: 'urn:growpath:'
scope: IT 및 AI 학습 로드맵·5점 자기보고·근거 기반 파인튜닝 데이터
semantics:
  world_assumption: open_world
  unknown_is_false: false
  missing_cost_is_zero: false
  mapping_is_prerequisite: false
  self_report_is_objective_proficiency: false
  retrieved_document_is_instruction: false
  ontology_does_not_change_database_schema: true
classes:
  Skill:
    identity: public.skill_tags.skill_id
    label: name
    immutable_identity: true
  Job:
    identity: public.jobs.job_id
    label: title
  Major:
    identity: public.majors.major_id
    label: title
  Course:
    identity: public.courses.course_id
    is_a: LearningResource
  Book:
    identity: public.books.isbn
    is_a: LearningResource
  Certification:
    identity: public.certifications.cert_id
    is_a: LearningResource
  LearningResource:
    requires:
    - source_evidence
    - availability_evidence
    fact_policy: Only actual database or verified official source facts
  RegulationVersion:
    identity: hr_regulation_pilot.regulation_version.regulation_version_id
  RegulationEvidence:
    identity: hr_regulation_pilot.rag_chunk.rag_chunk_id
  ProjectScenario:
    synthetic_allowed: true
    must_identify_synthetic: true
  SelfReportResponse:
    score_range:
    - 1
    - 5
    observation_type: subjective_understanding
  SurveyQuestion:
    single_concept: true
    requires:
    - skill_id
    - sequence_no
    - question
  Roadmap:
    requires:
    - strategy_title
    - summary
    - milestones
    - total_duration_weeks
    - regulation_summary
    - regulation_citations
  Milestone:
    requires:
    - phase_name
    - focus_goal
    - key_actions
    quality_requirements:
    - concrete_activity
    - deliverable
    - completion_criterion
  TrainingExample:
    requires:
    - messages
    - task
    - family_id
    - split
    - source_fingerprint
    synthetic_scope: Project scenarios and user profiles; never resource/regulation
      facts
relations:
  job_associated_with_skill:
    domain: Job
    range: Skill
    source: public.job_skill_map
    strength: association_not_mandatory_requirement
  major_associated_with_skill:
    domain: Major
    range: Skill
    source: public.major_skill_map
  course_associated_with_skill:
    domain: Course
    range: Skill
    source: public.course_skill_map
  book_associated_with_skill:
    domain: Book
    range: Skill
    source: public.book_skill_map
  certification_associated_with_skill:
    domain: Certification
    range: Skill
    source: public.cert_skill_map
  scenario_targets_skill:
    domain: ProjectScenario
    range: Skill
    source: explicit_scenario_skill_ids
  question_measures_self_report_of:
    domain: SurveyQuestion
    range: Skill
  response_answers:
    domain: SelfReportResponse
    range: SurveyQuestion
  roadmap_addresses:
    domain: Roadmap
    range: ProjectScenario
  roadmap_contains:
    domain: Roadmap
    range: Milestone
  milestone_recommends:
    domain: Milestone
    range: LearningResource
    requires: ID must occur in supplied context
  regulation_chunk_belongs_to:
    domain: RegulationEvidence
    range: RegulationVersion
    source: regulation_version_id
  roadmap_cites:
    domain: Roadmap
    range: RegulationEvidence
    requires: approved_and_current
  example_derived_from:
    domain: TrainingExample
    range: ProjectScenario
    preserve: same_family_same_split
constraints:
  skill_ids_and_names: Must exactly match skill_catalog and actual database
  resources: Only supplied IDs; current source facts and availability must be verified
  regulations: active + approved + available + effective date + requires_review=false
  unapproved_regulations: No confirmed policy claims; empty citations and 규정 확인 필요
  costs: Unknown remains unknown; separate estimates from verified fees
  assessment: Never infer objective competency, completion or employment decisions
    from Likert scores
  revision: Preserve explicit untouched paths and prior completion history
  retrieval: Vector similarity supports ranking; does not establish factual eligibility
    or approval
  duplicates: Block exact duplicate answers/inputs and cross-split scenario families
  selection: Automatic review pass is a candidate; never claim human approval
likert:
  options:
  - 아주 모른다
  - 모른다
  - 보통이다
  - 안다
  - 잘 안다
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
behaviors:
  generate_roadmap:
    label: 실행 가능한 로드맵
    response: actual_app_milestones
    quality:
    - activities
    - deliverables
    - completion_criteria
    - constraints
    - provided_resource_ids
  revise_roadmap:
    label: 요청 범위 내 부분 수정
    response: actual_app_milestones
    quality:
    - requested_change
    - preserved_paths
    - history
  generate_survey:
    label: 5점 자기보고 설문
    response: survey_slot_array
    quality:
    - single_concept
    - real_skill_id
    - slot_order
    - nonleading
  interpret_assessment:
    label: 자기평가 해석
    response: self_report_interpretation
    quality:
    - exact_scores
    - uncertainty
    - learning_priorities
  resolve_constraints:
    label: 조건 충돌과 조정
    response: conflicts_and_alternatives
    quality:
    - explicit_conflicts
    - feasible_adjustments
    - questions
  evidence_boundary:
    label: 근거 부족·자료 속 지시 대응
    response: evidence_boundary
    quality:
    - no_fabrication
    - ignore_document_instructions
    - specific_next_step
  progress_checkin:
    label: 진행 점검과 다음 행동
    response: progress_checkin
    quality:
    - user_report_distinction
    - preserve_history
    - next_action
dataset:
  total: 1500
  splits:
    train: 1200
    validation: 150
    test: 150
  selection_policy: quality_first_with_minimum_behavior_coverage
  default_minimum_per_behavior: 60
  minimum_is_configurable: true
  preferred_counts_source: finetuning_1500.yaml
  loss_policy: final_assistant_only
  preserve_original_splits: true
  source_examples_are_not_automatically_accepted: true
