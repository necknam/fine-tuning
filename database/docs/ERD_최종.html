* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

function roundPath(pts,r){
  const p=pts.filter((q,i)=>i===0||q[0]!==pts[i-1][0]||q[1]!==pts[i-1][1]);
  const q=p.filter((c,i)=>i===0||i===p.length-1||!((p[i-1][0]===c[0]&&c[0]===p[i+1][0])||(p[i-1][1]===c[1]&&c[1]===p[i+1][1])));
  let d=`M${q[0][0]},${q[0][1]}`;
  for(let i=1;i<q.length-1;i++){const [x0,y0]=q[i-1],[x,y]=q[i],[x1,y1]=q[i+1];
    const r1=Math.min(r,Math.hypot(x-x0,y-y0)/2,Math.hypot(x1-x,y1-y)/2);
    const ax=x-Math.sign(x-x0)*r1,ay=y-Math.sign(y-y0)*r1,bx=x+Math.sign(x1-x)*r1,by=y+Math.sign(y1-y)*r1;d+=`L${ax},${ay}Q${x},${y} ${bx},${by}`}

}

function showEdge(i){clearMarks();const e=model.edges[i];mark([i],new Set([e.from,e.to]))}
function restore(){clearMarks();if(pinned&&model.cards[pinned])showTable(pinned);search(true)}
function pin(k){pinned=k;canvas.querySelectorAll('.card.pinned').forEach(c=>c.classList.remove('pinned'));model.cards[k].classList.add('pinned');showTable(k);details(k)}
function reset(){pinned=null;detail.hidden=true;canvas.querySelectorAll('.card.pinned').forEach(c=>c.classList.remove('pinned'));clearMarks();search(true)}
const tableName=k=>D[k]?D[k].label:k;
function details(k){const s=D[k],e=model.edges;detail.hidden=false;
  const pc=getComputedStyle(model.cards[k]).getPropertyValue('--pc');detail.style.setProperty('--pc',pc);
  const out=s.fks.map(f=>'<li><code>'+esc(f.columns.join(', '))+'</code> → '+esc(tableName(f.target))+' <code>'+esc(f.target+'('+f.target_columns.join(', ')+')')+'</code>'+(model.cards[f.target]?'':' <span class="sub">(다른 구조)</span>')+'</li>').join('');
  const inc=Object.entries(D).flatMap(([kk,ss])=>ss.fks.filter(f=>f.target===k).map(f=>'<li>'+esc(ss.label)+' <code>'+esc(kk+'('+f.columns.join(', ')+')')+'</code>'+(model.cards[kk]?'':' <span class="sub">(다른 구조)</span>')+'</li>')).join('');
  const other=(s.constraints||[]).filter(c=>c.type!=='f').map(c=>c.name+'\n'+c.definition).join('\n\n');
  detail.innerHTML='<button class="close">닫기</button><h3>'+esc(s.label)+'</h3><code>'+esc(k)+'</code> · '+Number(s.rows).toLocaleString('ko-KR')+'행 · 기본키 <code>'+esc(s.pk.join(', '))+'</code>'+
    '<h4>이 표가 참조하는 표 (FK '+s.fks.length+'개)</h4>'+(out?'<ul>'+out+'</ul>':'<span class="sub">없음</span>')+
    '<h4>이 표를 참조하는 표</h4>'+(inc?'<ul>'+inc+'</ul>':'<span class="sub">없음</span>')+
    (other?'<h4>기본키·고유·검사 제약조건</h4><pre>'+esc(other)+'</pre>':'');
  detail.querySelector('.close').onclick=reset}
function tipShow(ev,e){tip.innerHTML=e.fks.map(f=>'<code>'+esc(e.from.split('.')[1]+'.'+f.columns.join(', '))+'</code> → <code>'+esc(e.to.split('.')[1]+'.'+f.target_columns.join(', '))+'</code>').join('<br>')+'<br><span style="opacity:.75">'+esc(tableName(e.from))+' → '+esc(tableName(e.to))+'</span>';tip.hidden=false;tipMove(ev)}
function tipMove(ev){const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,ev.clientX+14)+'px';tip.style.top=Math.min(innerHeight-h-8,ev.clientY+14)+'px'}
// 검색
function search(keepView){const q=document.querySelector('#search').value.trim().toLowerCase();if(!model)return null;let first=null;
  for(const k in model.cards){const hit=!!q&&(k+' '+D[k].label).toLowerCase().includes(q);model.cards[k].classList.toggle('match',hit);if(hit&&!first)first=k;
    if(q&&!pinned)model.cards[k].classList.toggle('dim',!hit)}
  return first}
function goTo(k){const p=model.pos[k];vp.scrollTo({left:Math.max(0,(p.x+W/2)*scale-vp.clientWidth/2),top:Math.max(0,(p.y+60)*scale-vp.clientHeight/3),behavior:'smooth'})}
// 확대·이동
function applyZoom(s,cx,cy){const ox=cx??vp.clientWidth/2,oy=cy??vp.clientHeight/2;const ux=(vp.scrollLeft+ox)/scale,uy=(vp.scrollTop+oy)/scale;
  scale=Math.max(.25,Math.min(1.6,s));canvas.style.transform=`scale(${scale})`;stage.style.width=model.TW*scale+'px';stage.style.height=model.TH*scale+'px';
  document.querySelector('#zoom').textContent=Math.round(scale*100)+'%';vp.scrollLeft=ux*scale-ox;vp.scrollTop=uy*scale-oy}
function fitAll(){applyZoom(Math.min((vp.clientWidth-8)/model.TW,(vp.clientHeight-8)/model.TH));vp.scrollTo(0,0)}
function fitWidth(){applyZoom(Math.max(.6,Math.min(1,(vp.clientWidth-8)/model.TW)));vp.scrollTo(0,0)}
vp.addEventListener('wheel',ev=>{if(!ev.ctrlKey)return;ev.preventDefault();const r=vp.getBoundingClientRect();applyZoom(scale*(ev.deltaY<0?1.1:1/1.1),ev.clientX-r.left,ev.clientY-r.top)},{passive:false});
let drag=null;
vp.addEventListener('pointerdown',ev=>{if(ev.button!==0||ev.target.closest('.card,.edge'))return;drag={x:ev.clientX,y:ev.clientY,l:vp.scrollLeft,t:vp.scrollTop,moved:false};vp.setPointerCapture(ev.pointerId)});
vp.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;vp.classList.add('panning')}vp.scrollLeft=drag.l-dx;vp.scrollTop=drag.t-dy});
vp.addEventListener('pointerup',()=>{if(drag&&!drag.moved&&pinned)reset();drag=null;vp.classList.remove('panning')});
function listTables(){detail.hidden=false;detail.style.removeProperty('--pc');const ks=Object.keys(model.cards).filter(k=>!model.ghosts.has(k));
  detail.innerHTML='<button class="close">닫기</button><h3>'+VIEW_NAME[view]+' 표 '+ks.length+'개</h3><ol>'+ks.map(k=>'<li><a data-k="'+esc(k)+'">'+esc(D[k].label)+'</a> <code>'+esc(k)+'</code></li>').join('')+'</ol>';
  detail.querySelector('.close').onclick=()=>{detail.hidden=true};detail.querySelectorAll('a[data-k]').forEach(a=>a.onclick=()=>{pin(a.dataset.k);goTo(a.dataset.k)})}
function render(){pinned=null;detail.hidden=true;tip.hidden=true;build();if(firstFit){fitWidth();firstFit=false}else{applyZoom(scale);vp.scrollTo(0,0)}}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render()};
document.querySelector('#all').onchange=ev=>{document.body.classList.toggle('allcols',ev.target.checked);const keep=pinned;build();if(keep&&model.cards[keep])pin(keep)};
document.querySelector('#search').oninput=()=>{if(!pinned)clearMarks();search()};
document.querySelector('#search').onkeydown=ev=>{if(ev.key==='Enter'){const k=search();if(k)goTo(k)}};
document.querySelector('#reset').onclick=reset;document.querySelector('#list').onclick=listTables;
document.querySelector('#fit').onclick=fitAll;document.querySelector('#actual').onclick=()=>applyZoom(1);
document.querySelector('#minus').onclick=()=>applyZoom(scale-.1);document.querySelector('#plus').onclick=()=>applyZoom(scale+.1);
document.querySelector('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark'};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')reset()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>applyZoom(scale),120)});

// Local, schema-specific table positions. No server or database writes.
const LAYOUT_KEY='growpath-erd-drag-project-prompts-v2-'+Object.keys(D).sort().join('|');
let savedLayouts={};try{savedLayouts=JSON.parse(localStorage.getItem(LAYOUT_KEY)||'{}')}catch{}
let tableDrag=null,suppressTableClickUntil=0;
const layoutMode=()=>view+(document.querySelector('#all').checked?':all':':keys');
function saveLayout(){try{localStorage.setItem(LAYOUT_KEY,JSON.stringify(savedLayouts));document.querySelector('#dragNotice').textContent='표 제목을 드래그 · 배치 저장됨'}catch{document.querySelector('#dragNotice').textContent='자동 저장 불가 · 배치 내보내기를 사용하세요'}}
function updateDraggedGeometry(){
 const {cards,pos,edges}=model;
 const off=(k,col)=>{const row=cards[k].querySelector('.row[data-col="'+CSS.escape(col)+'"]');return row&&row.offsetParent?row.offsetTop+row.offsetHeight/2:22};
 for(const e of edges){
  const A=pos[e.from],B=pos[e.to];if(!A.moved&&!B.moved)continue;
  const ya=A.y+off(e.from,e.fc),yb=B.y+off(e.to,e.tc);let pts,dir;
  if(e.from===e.to){const x=A.x+W;pts=[[x,ya],[x+26,ya],[x+26,yb],[x,yb]];dir=-1}
  else if(A.x+W+24<B.x){const m=(A.x+W+B.x)/2;pts=[[A.x+W,ya],[m,ya],[m,yb],[B.x,yb]];dir=1}
  else if(B.x+W+24<A.x){const m=(B.x+W+A.x)/2;pts=[[A.x,ya],[m,ya],[m,yb],[B.x+W,yb]];dir=-1}
  else{const m=Math.max(A.x+W,B.x+W)+30;pts=[[A.x+W,ya],[m,ya],[m,yb],[B.x+W,yb]];dir=-1}
  const end=pts[pts.length-1];pts[pts.length-1]=[end[0]-dir*8,end[1]];
  const path=roundPath(pts,7);for(const q of e.el.querySelectorAll('.vis,.hit'))q.setAttribute('d',path);
  const dot=e.el.querySelector('.dot');dot.setAttribute('cx',pts[0][0]);dot.setAttribute('cy',pts[0][1]);
  e.el.querySelector('.arw').setAttribute('d',`M${end[0]},${end[1]}l${-dir*10},-5v10z`);
 }
 for(const panel of canvas.querySelectorAll('.panel')){
  const group=panel.dataset.dragGroup;if(!group)continue;
  const members=Object.keys(cards).filter(k=>pos[k].p.g===group);if(!members.length)continue;
  const x=Math.min(...members.map(k=>pos[k].x))-PX,y=Math.min(...members.map(k=>pos[k].y))-PT;
  const right=Math.max(...members.map(k=>pos[k].x+W))+PX,bottom=Math.max(...members.map(k=>pos[k].y+cards[k].offsetHeight))+PB;
  Object.assign(panel.style,{left:x+'px',top:y+'px',width:(right-x)+'px',height:(bottom-y)+'px'});
 }
 model.TW=Math.max(model.baseTW,...Object.keys(cards).map(k=>pos[k].x+W+M));model.TH=Math.max(model.baseTH,...Object.keys(cards).map(k=>pos[k].y+cards[k].offsetHeight+M));
 canvas.style.width=model.TW+'px';canvas.style.height=model.TH+'px';svg.setAttribute('width',model.TW);svg.setAttribute('height',model.TH);stage.style.width=model.TW*scale+'px';stage.style.height=model.TH*scale+'px';
}
function setupTableDrag(){
 const {cards,pos}=model;model.baseTW=model.TW;model.baseTH=model.TH;
 const groups=[...new Set(Object.keys(cards).map(k=>pos[k].p.g))];[...canvas.querySelectorAll('.panel')].forEach((p,i)=>p.dataset.dragGroup=groups[i]||'');
 const stored=savedLayouts[layoutMode()]||{};
 for(const k in cards){const p=pos[k];p.baseX=p.x;p.baseY=p.y;
  const xy=stored[k];if(xy&&Number.isFinite(xy.x)&&Number.isFinite(xy.y)){p.x=Math.max(M,p.x+xy.x);p.y=Math.max(PT+12,p.y+xy.y);p.moved=true;Object.assign(cards[k].style,{left:p.x+'px',top:p.y+'px'})}
  const head=cards[k].querySelector('.ch');head.title='드래그하여 표 이동 · 클릭하여 관계 확인';
  head.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;ev.preventDefault();ev.stopPropagation();tableDrag={key:k,id:ev.pointerId,head,x:ev.clientX,y:ev.clientY,px:p.x,py:p.y,left:vp.scrollLeft,top:vp.scrollTop,moved:false,wasMoved:p.moved};head.setPointerCapture(ev.pointerId)});
  head.addEventListener('pointermove',ev=>{const t=tableDrag;if(!t||t.key!==k||ev.pointerId!==t.id)return;
   const dx=(ev.clientX-t.x+vp.scrollLeft-t.left)/scale,dy=(ev.clientY-t.y+vp.scrollTop-t.top)/scale;
   if(!t.moved&&Math.abs(ev.clientX-t.x)+Math.abs(ev.clientY-t.y)<4)return;t.moved=true;p.moved=true;cards[k].classList.add('dragging');p.x=Math.max(M,t.px+dx);p.y=Math.max(PT+12,t.py+dy);Object.assign(cards[k].style,{left:p.x+'px',top:p.y+'px'});updateDraggedGeometry()});
  const finish=(ev,cancel)=>{const t=tableDrag;if(!t||t.key!==k||ev.pointerId!==t.id)return;tableDrag=null;cards[k].classList.remove('dragging');
   if(cancel){p.x=t.px;p.y=t.py;p.moved=t.wasMoved;Object.assign(cards[k].style,{left:p.x+'px',top:p.y+'px'});if(t.moved){p.moved=true;updateDraggedGeometry();p.moved=t.wasMoved}}
   else if(t.moved){(savedLayouts[layoutMode()]??={})[k]={x:p.x-p.baseX,y:p.y-p.baseY};saveLayout();suppressTableClickUntil=performance.now()+350;tip.hidden=true;restore()}
   if(head.hasPointerCapture(ev.pointerId))head.releasePointerCapture(ev.pointerId);
  };
  head.addEventListener('pointerup',ev=>finish(ev,false));head.addEventListener('pointercancel',ev=>finish(ev,true));
 }
 if(Object.values(pos).some(p=>p.moved))updateDraggedGeometry();
}
canvas.addEventListener('click',ev=>{if(performance.now()<suppressTableClickUntil){ev.preventDefault();ev.stopImmediatePropagation()}},true);
document.querySelector('#layoutReset').onclick=()=>{delete savedLayouts[layoutMode()];saveLayout();render()};
document.querySelector('#layoutExport').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,schemaTables:Object.keys(D).sort(),layouts:savedLayouts},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ERD_배치.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

// 주소의 #view=archive&table=public.roadmaps 로 보기와 선택한 표를 바로 열 수 있다.
const hp=new URLSearchParams(location.hash.slice(1));if(LAYOUT[hp.get('view')])view=hp.get('view');
render();
const startTable=hp.get('table');if(startTable&&model.cards[startTable]){pin(startTable);goTo(startTable)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const keep=pinned;build();if(keep&&model.cards[keep])pin(keep)});
</script></body></html>
