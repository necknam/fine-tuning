services:
  database:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    container_name: growpath-postgres-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: growpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use --env-file .env.local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growpath"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
    external: true
    name: growpath_pgdata_20261020
