<head>

<title>GrowPath 통합 ERD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 레이아웃: 상단 막대(탭·조작) + 세 보기. ERD는 확대·축소 캔버스에 묶음 패널·표 카드·SVG 참조선. 표 출처는 테두리 형식과 꼬리표로 구분한다. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --card: #ffffff; --ink: #1d2330; --muted: #667085;
  --line-soft: #e1e5ec; --head: #eef1f6; --shadow: 0 1px 3px rgba(20,24,40,.10);
  --c1: #2f6fed; --c2: #0f9d8a; --c3: #d98a00; --c4: #8b5cf6; --c5: #2e9e4f; --c6: #c2410c; --c7: #64748b;
  --pk: #c27a00; --fk: #2f6fed;
  --o-live: #475569; --o-team: #0e7490; --o-outside: #a16207; --o-port: #b4235a; --o-bridge: #b45309; --o-pending: #7c3aed;
  --prop: #b4235a; --map: #8a94a6;
  --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-code: "IBM Plex Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161c; --panel: #1a1e26; --card: #222733; --ink: #e7eaf0; --muted: #9aa3b2;
    --line-soft: #333a48; --head: #29303f; --shadow: 0 1px 3px rgba(0,0,0,.5);
    --c1: #6f9bff; --c2: #3fc4b0; --c3: #f0b040; --c4: #ae8cff; --c5: #5cc47a; --c6: #fb8c5a; --c7: #9aa7bb;
    --pk: #f0b040; --fk: #6f9bff;
    --o-live: #a3b1c6; --o-team: #4cc3dc; --o-outside: #e7b54a; --o-port: #f27aa6; --o-bridge: #f2a65a; --o-pending: #b896ff;
    --prop: #f27aa6; --map: #7d879a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161c; --panel: #1a1e26; --card: #222733; --ink: #e7eaf0; --muted: #9aa3b2;
  --line-soft: #333a48; --head: #29303f; --shadow: 0 1px 3px rgba(0,0,0,.5);
  --c1: #6f9bff; --c2: #3fc4b0; --c3: #f0b040; --c4: #ae8cff; --c5: #5cc47a; --c6: #fb8c5a; --c7: #9aa7bb;
  --pk: #f0b040; --fk: #6f9bff;
  --o-live: #a3b1c6; --o-team: #4cc3dc; --o-outside: #e7b54a; --o-port: #f27aa6; --o-bridge: #f2a65a; --o-pending: #b896ff;
  --prop: #f27aa6; --map: #7d879a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  display: flex; flex-direction: column; overflow: hidden; }
.bar { flex: none; background: var(--panel); border-bottom: 1px solid var(--line-soft);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; }
.bar h1 { font-size: 16px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; background: var(--head); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
  padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; }
.ctl button { border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); border-radius: 6px;
  padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
.ctl button:hover { background: var(--head); }
button:focus-visible, input:focus-visible, .card:focus-visible, tr:focus-visible { outline: 2px solid var(--fk); outline-offset: 2px; }
.ctl label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
#zv { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; width: 100%; }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--muted); vertical-align: middle; margin-right: 4px; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { border-top: 2px dotted var(--map); }
.legend i.prop { border-top: 2px dashed var(--prop); }
.tag { display: inline-block; font-size: 9.5px; font-weight: 600; letter-spacing: .02em; padding: 0 5px; border-radius: 4px;
  border: 1px solid currentColor; line-height: 15px; white-space: nowrap; }
.o-live { color: var(--o-live); } .o-team_new { color: var(--o-team); } .o-outside { color: var(--o-outside); }
.o-port { color: var(--o-port); } .o-bridge { color: var(--o-bridge); } .o-pending { color: var(--o-pending); }
.view { flex: 1; min-height: 0; overflow: auto; }
#stage { transform-origin: 0 0; position: relative; }
#canvas { position: relative; padding: 28px; display: grid; gap: 56px 64px; width: max-content;
  grid-template-areas: "p1 p2 p3" "p5 p7 p7" "p4 p4 p6"; align-items: start; }
#links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.panel { position: relative; background: var(--panel); border: 1px solid var(--line-soft); border-top: 4px solid var(--pc);
  border-radius: 12px; padding: 40px 18px 20px; box-shadow: var(--shadow); }
.panel > .ptitle { position: absolute; left: 14px; top: 10px; font-weight: 700; font-size: 13px; color: var(--pc); }
.panel > .ptitle small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.pbody { display: grid; gap: 22px 60px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: 8px; box-shadow: var(--shadow);
  overflow: hidden; position: relative; z-index: 2; transition: opacity .12s; cursor: pointer; }
.card.port { border: 1.5px dashed var(--o-port); }
.card.bridge { border: 1.5px dotted var(--o-bridge); }
.card.pending { border: 1.5px dashed color-mix(in srgb, var(--o-pending) 60%, var(--line-soft)); }
.card.outside { border-top: 3px double var(--o-outside); }
.card .ch { background: var(--head); padding: 6px 10px; border-bottom: 2px solid var(--pc); display: grid; gap: 3px; }
.card .ch .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .ch b { font-size: 13px; }
.card .ch .meta { font-family: var(--font-code); font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; }
.card .ch .note { font-size: 10.5px; color: var(--ink); line-height: 1.35; padding: 3px 6px; border-radius: 4px;
  background: color-mix(in srgb, var(--o-port) 10%, transparent); }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 10px; font-size: 11.5px; min-height: 22px; border-top: 1px solid var(--line-soft); }
.ch + .row { border-top: 0; }
.row.plain { display: none; }
body.allcols .row.plain { display: flex; }
.row.more { color: var(--muted); font-size: 10.5px; justify-content: center; }
body.allcols .row.more { display: none; }
.row .bd { width: 18px; flex: none; font-size: 9px; font-weight: 700; text-align: center; }
.row .bd.pk { color: var(--pk); } .row .bd.fk { color: var(--fk); }
.row .nm { font-family: var(--font-code); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.is-pk .nm { font-weight: 600; }
.row .ty { color: var(--muted); font-size: 10px; flex: none; font-family: var(--font-code); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nn { color: var(--muted); font-size: 9px; flex: none; width: 16px; text-align: right; }
.row.link-hl { background: color-mix(in srgb, var(--pc) 16%, transparent); }
body.kr .row .nm { font-family: var(--font-ui); }
.dim { opacity: .16; }
path.ln { fill: none; stroke-width: 1.6; opacity: .75; transition: opacity .12s, stroke-width .12s; }
path.ln.arr { stroke-dasharray: 6 4; }
path.ln.map { stroke-dasharray: 2 4; stroke-width: 1.8; opacity: .9; pointer-events: visibleStroke; }
path.ln.prop { stroke-dasharray: 8 5; stroke-width: 2; pointer-events: visibleStroke; }
path.ln.on { stroke-width: 2.8; opacity: 1; }
path.ln.dim { opacity: .05; }
.mk { transition: opacity .12s; }
.mk.dim { opacity: .05; }
.doc { max-width: 1040px; margin: 0 auto; padding-block: 22px 48px; padding-inline: 16px; display: grid; gap: 18px; }
.doc h2 { font-size: 18px; margin: 0; text-wrap: balance; }
.doc p.lead { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; max-width: 70ch; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.counts span { background: var(--card); border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 12px; font-size: 13px;
  font-variant-numeric: tabular-nums; }
.counts b { font-size: 16px; margin-right: 4px; }
.tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line-soft); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { background: var(--head); font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--fk) 6%, transparent); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td code, .chip { font-family: var(--font-code); font-size: 11.5px; }
td .lbl { color: var(--muted); font-size: 12px; display: block; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, currentColor 12%, transparent); }
.rgroup { display: grid; gap: 10px; }
.rgroup h3 { font-size: 14px; margin: 6px 0 0; color: var(--muted); letter-spacing: .03em; }
.item { background: var(--card); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.item .ih { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .ih b { font-size: 14px; }
.item p { margin: 0; font-size: 13px; line-height: 1.6; max-width: 80ch; }
.item .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.chip { color: var(--muted); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 5px; }
.item button { justify-self: start; border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); border-radius: 6px;
  padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.item button:hover { background: var(--head); }
.lv-결정 { color: var(--o-pending); } .lv-주의 { color: var(--o-bridge); } .lv-제안 { color: var(--o-port); } .lv-확인 { color: var(--c5); }
.ac-replace { color: var(--o-team); } .ac-port { color: var(--o-port); } .ac-bridge { color: var(--o-bridge); } .ac-pending { color: var(--o-pending); }
@media (prefers-reduced-motion: reduce) { .card, path.ln, .mk { transition: none; } }
</style>
</head>

      const bar = document.createElementNS(NS, 'line');
      bar.setAttribute('x1', tx + side * 5); bar.setAttribute('x2', tx + side * 5); bar.setAttribute('y1', ty - 6); bar.setAttribute('y2', ty + 6);
      bar.setAttribute('stroke', col); bar.setAttribute('stroke-width', 2.4); bar.setAttribute('class', 'mk');
      parts.push(dot, bar);
    }
    g.append(...parts); svg.appendChild(g);
    drawn.push({ r, p, marks: parts.slice(1), sr, tr });
  });
}
function clearFocus() {
  for (const d of drawn) {
    d.p.classList.remove('on', 'dim'); d.marks.forEach(m => m.classList.remove('dim'));
    d.sr.classList.remove('link-hl'); d.tr.classList.remove('link-hl');
  }
  for (const el of Object.values(cardEl)) el.classList.remove('dim');
}
function focusSet(names, expand) {
  clearFocus();
  const set = new Set(names), keep = new Set(names);
  for (const d of drawn) {
    const hit = expand ? (set.has(d.r.t) || set.has(d.r.rt)) : (set.has(d.r.t) && set.has(d.r.rt));
    d.p.classList.toggle('on', hit); d.p.classList.toggle('dim', !hit);
    d.marks.forEach(m => m.classList.toggle('dim', !hit));
    if (hit) { keep.add(d.r.t); keep.add(d.r.rt); d.sr.classList.add('link-hl'); d.tr.classList.add('link-hl'); }
  }
  for (const [n, el] of Object.entries(cardEl)) el.classList.toggle('dim', !keep.has(n));
}
let pinned = null;
function pin(names, expand) { pinned = { names, expand }; focusSet(names, expand); }
function unpin() { pinned = null; clearFocus(); }
for (const [n, el] of Object.entries(cardEl)) {
  el.addEventListener('mouseenter', () => { if (!pinned) focusSet([n], true); });
  el.addEventListener('mouseleave', () => { if (!pinned) clearFocus(); });
  el.addEventListener('click', e => { e.stopPropagation(); if (pinned && pinned.names.length === 1 && pinned.names[0] === n) unpin(); else pin([n], true); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } });
}
document.getElementById('viewport').addEventListener('click', unpin);

const stage = document.getElementById('stage');
const viewport = document.getElementById('viewport');
function setScale(s) {
  scale = Math.max(0.15, Math.min(1.6, s));
  stage.style.transform = `scale(${scale})`;
  stage.style.width = canvas.scrollWidth * scale + 'px'; stage.style.height = canvas.scrollHeight * scale + 'px';
  document.getElementById('zv').textContent = Math.round(scale * 100) + '%';
  draw(); if (pinned) focusSet(pinned.names, pinned.expand);
}
function fit() { if (!viewport.hidden) setScale(Math.min(1, (viewport.clientWidth - 8) / canvas.scrollWidth)); }
function scrollToCards(names) {
  const els = names.map(n => cardEl[n]).filter(Boolean);
  if (!els.length) return;
  const vr = viewport.getBoundingClientRect();
  const boxes = els.map(e => e.getBoundingClientRect());
  const left = Math.min(...boxes.map(b => b.left)), top = Math.min(...boxes.map(b => b.top));
  viewport.scrollBy({ left: left - vr.left - 40, top: top - vr.top - 40, behavior: 'smooth' });
}
document.getElementById('zi').onclick = () => setScale(scale + 0.1);
document.getElementById('zo').onclick = () => setScale(scale - 0.1);
document.getElementById('zf').onclick = fit;
document.getElementById('tAll').onchange = e => { document.body.classList.toggle('allcols', e.target.checked); setScale(scale); };
document.getElementById('tMap').onchange = () => setScale(scale);
document.getElementById('tProp').onchange = () => setScale(scale);
document.getElementById('tKr').onchange = e => {
  document.body.classList.toggle('kr', e.target.checked);
  document.querySelectorAll('.nm').forEach(n => { n.textContent = e.target.checked ? n.dataset.kr : n.dataset.en; });
};
document.getElementById('tTheme').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

// 대응표
const actionCount = a => D.mapping.filter(m => m.action === a).length;
const tableKey = m => m.action === 'replace' ? m.dest : 'ours.' + m.t;
let mh = `<h2>우리 가상 DB ${D.meta.ours} → 팀원 DB 대응표</h2>
<p class="lead">우리 표 ${D.mapping.length}개를 어디로 보낼지 정리했습니다. 직원 쪽 표는 새로 얹고, 직무·자격·평가기준 같은 마스터는 팀원의 실제 데이터를 씁니다. 행을 누르면 ERD에서 해당 표를 보여 줍니다.</p>
<div class="counts">${Object.keys(ACTION).map(a => `<span class="ac-${a}"><b>${actionCount(a)}</b>${ACTION[a]}</span>`).join('')}</div>
<div class="tbl-wrap"><table><thead><tr><th>우리 표</th><th>행</th><th>처리</th><th>행선지</th><th>할 일·주의</th></tr></thead><tbody>`;
const order = ['port', 'replace', 'bridge', 'pending'];
for (const m of [...D.mapping].sort((a, b) => order.indexOf(a.action) - order.indexOf(b.action))) {
  mh += `<tr tabindex="0" data-k="${esc(tableKey(m))}"><td><code>${esc(m.t)}</code><span class="lbl">${esc(m.label)}</span></td><td class="num">${m.rows}</td>` +
        `<td><span class="pill ac-${m.action}">${ACTION[m.action]}</span></td><td>${m.dest ? `<code>${esc(m.dest)}</code>` : '—'}</td><td>${esc(m.note) || '—'}</td></tr>`;
}
mh += '</tbody></table></div>';
document.getElementById('mapDoc').innerHTML = mh;

// 구조 검토
const levels = ['결정', '주의', '제안', '확인'];
let rh = `<h2>구조 검토</h2>
<p class="lead">통합 ERD를 그리며 확인한 내용입니다. '결정'은 팀이 정해야 포팅 방향이 정해지는 항목, '주의'는 그대로 옮기면 어긋나는 항목입니다. 'ERD에서 보기'를 누르면 관련 표만 남깁니다.</p>
<div class="counts">${levels.map(l => `<span class="lv-${l}"><b>${D.review.filter(i => i.level === l).length}</b>${l}</span>`).join('')}</div>`;
const groups = [...new Set(D.review.map(i => i.group))];
D.review.forEach((it, i) => { it.i = i; });
for (const g of groups) {
  rh += `<section class="rgroup"><h3>${esc(g)}</h3>`;
  for (const it of D.review.filter(x => x.group === g)) {
    rh += `<article class="item"><div class="ih"><span class="pill lv-${it.level}">${it.level}</span><b>${esc(it.title)}</b></div><p>${esc(it.detail)}</p>` +
          `<div class="chips">${it.tables.map(t => `<span class="chip">${esc(T[t].name)}</span>`).join('')}</div>` +
          `<button type="button" data-i="${it.i}">ERD에서 보기</button></article>`;
  }
  rh += '</section>';
}
document.getElementById('reviewDoc').innerHTML = rh;

const views = { erd: 'viewport', map: 'mapView', review: 'reviewView' };
function show(name) {
  for (const [k, id] of Object.entries(views)) {
    document.getElementById(id).hidden = k !== name;
    document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === name));
  }
  document.getElementById('erdCtl').hidden = name !== 'erd';
  document.getElementById('legend').hidden = name !== 'erd';
  if (name === 'erd') setScale(scale);
}
for (const k of Object.keys(views)) document.getElementById('tab-' + k).onclick = () => show(k);
function openInErd(names, expand) {
  show('erd');
  requestAnimationFrame(() => { pin(names, expand); scrollToCards(names); });
}
document.querySelectorAll('#mapDoc tbody tr').forEach(tr => {
  const go = () => openInErd([tr.dataset.k], true);
  tr.addEventListener('click', go);
  tr.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
});
document.querySelectorAll('#reviewDoc .item button').forEach(b => {
  b.addEventListener('click', () => openInErd(D.review[+b.dataset.i].tables, false));
});

window.addEventListener('resize', fit);
const initial = { map: 'map', review: 'review' }[location.hash.slice(1)];
if (initial) show(initial);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
fit();
</script>

</body>
</html>
